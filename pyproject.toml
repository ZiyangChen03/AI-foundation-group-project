[project]
name = "battleship-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
]

[project.optional-dependencies]
# Only the DQN agent (battleship/dqn) needs PyTorch: `uv sync --extra dqn`, or
# `uv run --extra dqn ...`. numpy is not used directly; PyTorch warns without it.
dqn = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "battleship"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests", "battleship/q_learning/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
