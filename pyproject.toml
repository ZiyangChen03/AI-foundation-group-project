[project]
name = "battleship-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "battleship"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
